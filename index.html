        .rank-pts {

        .rank-bar { height: 5px; background: rgba(255, 255, 255, 0.04); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .rank-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .rank-details { display: none; padding: 8px 0 0 56px; font-size: 0.7rem; color: var(--text-secondary); }
        .rank-item.expanded .rank-details { display: block; }

        .toast {
            position: fixed; top: 16px; right: 16px;
            background: var(--card-premium); border: 1px solid var(--gold);
            padding: 12px 18px; border-radius: 12px; color: #fff;
            z-index: 9999; transform: translateX(120%); transition: transform 0.35s;
            font-size: 0.75rem;
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>

            h += '<div class="match-card">';
            h += '<div class="match-teams">';
            h += '<div class="team-block right"><span class="team-name">' + perdedor1 + '</span></div>';
            h += '<div class="vs-badge">vs</div>';
            h += '<div class="team-block left"><span class="team-name">' + perdedor2 + '</span></div>';
            h += '</div>';
            h += '<div class="score-row">';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + mt[0] + '" data-r="t" data-i="0" data-t="0" placeholder="-" ' + (finalBloqueada ? ' disabled' : '') + '>';
            h += '<span style="color:var(--gold);font-weight:700;">-</span>';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + mt[1] + '" data-r="t" data-i="0" data-t="1" placeholder="-" ' + (finalBloqueada ? ' disabled' : '') + '>';
            h += '</div>';
            h += '<button class="penal-btn" onclick="togglePenal(this)"' + (finalBloqueada ? ' disabled' : '') + '>⚽ Penales</button>';
            h += '<div class="penal-select">';
            h += '<select data-r="t" data-i="0"' + (finalBloqueada ? ' disabled' : '') + '>';
            h += '<option value="">Seleccionar ganador</option>';
            h += '<option value="local"' + (mt[2] === 'local' ? ' selected' : '') + '>' + perdedor1 + '</option>';
            h += '<option value="visitante"' + (mt[2] === 'visitante' ? ' selected' : '') + '>' + perdedor2 + '</option>';
            h += '</select>';
            h += '</div>';
            h += '</div></div>';
            
            h += '</div>';
            ct.innerHTML = h;
            
            ct.querySelectorAll('.score-input').forEach(function(inp) {
                inp.addEventListener('input', function() {
                    var r = this.dataset.r, i = parseInt(this.dataset.i), t = parseInt(this.dataset.t);
                    var match = (r === 'f' || r === 't') ? eo[r] : eo[r][i];
                    match[t] = this.value;
                    se(r, i);
                    renderBracket();
                });
            });
            
            ct.querySelectorAll('.penal-select select').forEach(function(sel) {
                sel.addEventListener('change', function() {
                    var r = this.dataset.r, i = parseInt(this.dataset.i);
                    var val = this.value || null;
                    var match = (r === 'f' || r === 't') ? eo[r] : eo[r][i];
                    match[2] = val;
                    se(r, i);
                    renderBracket();
                });
            });
        }
        
        function togglePenal(btn) {
            var selectDiv = btn.nextElementSibling;
            selectDiv.classList.toggle('active');
        }
        
        function renderPredicciones() {
            var ct = document.getElementById('bracketPred');
            if (!ct) return;
            var h = '<div class="bracket-container">';
            
            // Semifinales
            h += '<div class="round"><div class="round-title">Semifinales</div>';
            for (var i = 0; i < 2; i++) {
                var m = pe[cp].s[i] || ['','',null];
                var l = semisEquipos[i][0], v = semisEquipos[i][1];
                var bloq = (eo.s[i] && eo.s[i][0] !== '' && eo.s[i][1] !== '' && (eo.s[i][0] !== eo.s[i][1] || eo.s[i][2]));
                var bc = bloq ? ' blocked' : '', da = bloq ? ' disabled' : '';
                h += '<div class="match-card">';
                h += '<div class="match-teams">';
                h += '<div class="team-block right"><img class="team-flag" src="' + gf(l) + '" alt=""><span class="team-name">' + l + '</span></div>';
                h += '<div class="vs-badge">vs</div>';
                h += '<div class="team-block left"><span class="team-name">' + v + '</span><img class="team-flag" src="' + gf(v) + '" alt=""></div>';
                h += '</div>';
                h += '<div class="score-row">';
                h += '<input type="number" class="score-input prediccion' + bc + '" min="0" max="99" value="' + m[0] + '" data-r="s" data-i="' + i + '" data-t="0" placeholder="-" ' + da + '>';
                h += '<span style="color:var(--gold);font-weight:700;">-</span>';
                h += '<input type="number" class="score-input prediccion' + bc + '" min="0" max="99" value="' + m[1] + '" data-r="s" data-i="' + i + '" data-t="1" placeholder="-" ' + da + '>';
                h += '</div>';
                h += '<button class="penal-btn" onclick="togglePenal(this)"' + (bloq ? ' disabled' : '') + '>⚽ Penales</button>';
                h += '<div class="penal-select">';
                h += '<select data-r="s" data-i="' + i + '"' + (bloq ? ' disabled' : '') + '>';
                h += '<option value="">Seleccionar ganador</option>';
                h += '<option value="local"' + (m[2] === 'local' ? ' selected' : '') + '>' + l + '</option>';
                h += '<option value="visitante"' + (m[2] === 'visitante' ? ' selected' : '') + '>' + v + '</option>';
                h += '</select>';
                h += '</div>';
                h += '</div>';
            }
            h += '</div>';
            
            // Final y tercer lugar
            var semisListas = semisCompletas();
            var s1 = eo.s[0], s2 = eo.s[1];
            var final1 = '?', final2 = '?', perdedor1 = '?', perdedor2 = '?';
            if (semisListas) {
                var g1 = obtenerGanador(s1), g2 = obtenerGanador(s2);
                final1 = g1 === 'local' ? semisEquipos[0][0] : semisEquipos[0][1];
                final2 = g2 === 'local' ? semisEquipos[1][0] : semisEquipos[1][1];
                perdedor1 = g1 === 'local' ? semisEquipos[0][1] : semisEquipos[0][0];
                perdedor2 = g2 === 'local' ? semisEquipos[1][1] : semisEquipos[1][0];
            }
            
            var finalBloqueada = !semisListas || (eo.f[0] !== '' && eo.f[1] !== '');
            var tercerBloqueada = !semisListas || (eo.t[0] !== '' && eo.t[1] !== '');
            
            h += '<div class="round"><div class="round-title">Final</div>';
            var mf = pe[cp].f || ['','',null];
            h += '<div class="match-card">';
            h += '<div class="match-teams">';
            h += '<div class="team-block right"><span class="team-name">' + final1 + '</span></div>';
            h += '<div class="vs-badge">vs</div>';
            h += '<div class="team-block left"><span class="team-name">' + final2 + '</span></div>';
            h += '</div>';
            h += '<div class="score-row">';
            h += '<input type="number" class="score-input prediccion' + (finalBloqueada ? ' blocked' : '') + '" min="0" max="99" value="' + mf[0] + '" data-r="f" data-i="0" data-t="0" placeholder="-" ' + (finalBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '<span style="color:var(--gold);font-weight:700;">-</span>';
            h += '<input type="number" class="score-input prediccion' + (finalBloqueada ? ' blocked' : '') + '" min="0" max="99" value="' + mf[1] + '" data-r="f" data-i="0" data-t="1" placeholder="-" ' + (finalBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '</div>';
            h += '<button class="penal-btn" onclick="togglePenal(this)"' + (finalBloqueada || !semisListas ? ' disabled' : '') + '>⚽ Penales</button>';
            h += '<div class="penal-select">';
            h += '<select data-r="f" data-i="0"' + (finalBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '<option value="">Seleccionar ganador</option>';
            h += '<option value="local"' + (mf[2] === 'local' ? ' selected' : '') + '>' + final1 + '</option>';
            h += '<option value="visitante"' + (mf[2] === 'visitante' ? ' selected' : '') + '>' + final2 + '</option>';
            h += '</select>';
            h += '</div>';
            h += '</div></div>';
            
            h += '<div class="round"><div class="round-title">3er Lugar</div>';
            var mt = pe[cp].t || ['','',null];
            h += '<div class="match-card">';
            h += '<div class="match-teams">';
            h += '<div class="team-block right"><span class="team-name">' + perdedor1 + '</span></div>';
            h += '<div class="vs-badge">vs</div>';
            h += '<div class="team-block left"><span class="team-name">' + perdedor2 + '</span></div>';
            h += '</div>';
            h += '<div class="score-row">';
            h += '<input type="number" class="score-input prediccion' + (tercerBloqueada ? ' blocked' : '') + '" min="0" max="99" value="' + mt[0] + '" data-r="t" data-i="0" data-t="0" placeholder="-" ' + (tercerBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '<span style="color:var(--gold);font-weight:700;">-</span>';
            h += '<input type="number" class="score-input prediccion' + (tercerBloqueada ? ' blocked' : '') + '" min="0" max="99" value="' + mt[1] + '" data-r="t" data-i="0" data-t="1" placeholder="-" ' + (tercerBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '</div>';
            h += '<button class="penal-btn" onclick="togglePenal(this)"' + (tercerBloqueada || !semisListas ? ' disabled' : '') + '>⚽ Penales</button>';
            h += '<div class="penal-select">';
            h += '<select data-r="t" data-i="0"' + (tercerBloqueada || !semisListas ? ' disabled' : '') + '>';
            h += '<option value="">Seleccionar ganador</option>';
            h += '<option value="local"' + (mt[2] === 'local' ? ' selected' : '') + '>' + perdedor1 + '</option>';
            h += '<option value="visitante"' + (mt[2] === 'visitante' ? ' selected' : '') + '>' + perdedor2 + '</option>';
            h += '</select>';
            h += '</div>';
            h += '</div></div>';
            
            h += '</div>';
            ct.innerHTML = h;
            
            ct.querySelectorAll('.score-input').forEach(function(inp) {
                inp.addEventListener('input', function() {
                    if (this.classList.contains('blocked')) return;
                    var r = this.dataset.r, i = parseInt(this.dataset.i), t = parseInt(this.dataset.t);
                    var match = (r === 'f' || r === 't') ? pe[cp][r] : pe[cp][r][i];
                    match[t] = this.value;
                    spe(cp, r, i);
                    renderRanking();
                });
            });
            ct.querySelectorAll('.penal-select select').forEach(function(sel) {
                sel.addEventListener('change', function() {
                    if (this.disabled) return;
                    var r = this.dataset.r, i = parseInt(this.dataset.i);
                    var val = this.value || null;
                    var match = (r === 'f' || r === 't') ? pe[cp][r] : pe[cp][r][i];
                    match[2] = val;
                    spe(cp, r, i);
                    renderRanking();
                });
            });
        }
        
        function renderRanking() {
            var ct = document.getElementById('rankingContent');
            if (!ct) return;
            
            var pts = [];
            for (var pi = 0; pi < 5; pi++) {
                var puntos = rankingBase[pi] || 0;
                // Semifinales
                for (var i = 0; i < 2; i++) {
                    var of = eo.s[i] || ['','',null];
                    var pr = (pe[pi].s && pe[pi].s[i]) ? pe[pi].s[i] : ['','',null];
                    var golO = parseInt(of[0]), govO = parseInt(of[1]);
                    var golP = parseInt(pr[0]), govP = parseInt(pr[1]);
                    if (isNaN(golO) || isNaN(govO) || isNaN(golP) || isNaN(govP)) continue;
                    
                    var winnerO = null, winnerP = null;
                    if (golO !== govO) {
                        winnerO = golO > govO ? 'local' : 'visitante';
                        winnerP = golP > govP ? 'local' : 'visitante';
                    } else {
                        winnerO = of[2];
                        if (golP === govP) { winnerP = pr[2]; } else { winnerP = golP > govP ? 'local' : 'visitante'; }
                    }
                    
                    if (winnerO && winnerP) {
                        if (golP === golO && govP === govO && winnerP === winnerO) { puntos += 6; }
                        else if (winnerP === winnerO) { puntos += 3; }
                    }
                }
                // Final
                if (eo.f[0] !== '' && pe[pi].f[0] !== '') {
                    var of = eo.f, pr = pe[pi].f;
                    var golO = parseInt(of[0]), govO = parseInt(of[1]);
                    var golP = parseInt(pr[0]), govP = parseInt(pr[1]);
                    if (!isNaN(golO) && !isNaN(govO) && !isNaN(golP) && !isNaN(govP)) {
                        var winnerO = null, winnerP = null;
                        if (golO !== govO) {
                            winnerO = golO > govO ? 'local' : 'visitante';
                            winnerP = golP > govP ? 'local' : 'visitante';
                        } else {
                            winnerO = of[2];
                            if (golP === govP) { winnerP = pr[2]; } else { winnerP = golP > govP ? 'local' : 'visitante'; }
                        }
                        if (winnerO && winnerP) {
                            if (golP === golO && govP === govO && winnerP === winnerO) { puntos += 6; }
                            else if (winnerP === winnerO) { puntos += 3; }
                        }
                    }
                }
                // Tercer lugar
                if (eo.t[0] !== '' && pe[pi].t[0] !== '') {
                    var of = eo.t, pr = pe[pi].t;
                    var golO = parseInt(of[0]), govO = parseInt(of[1]);
                    var golP = parseInt(pr[0]), govP = parseInt(pr[1]);
                    if (!isNaN(golO) && !isNaN(govO) && !isNaN(golP) && !isNaN(govP)) {
                        var winnerO = null, winnerP = null;
                        if (golO !== govO) {
                            winnerO = golO > govO ? 'local' : 'visitante';
                            winnerP = golP > govP ? 'local' : 'visitante';
                        } else {
                            winnerO = of[2];
                            if (golP === govP) { winnerP = pr[2]; } else { winnerP = golP > govP ? 'local' : 'visitante'; }
                        }
                        if (winnerO && winnerP) {
                            if (golP === golO && govP === govO && winnerP === winnerO) { puntos += 6; }
                            else if (winnerP === winnerO) { puntos += 3; }
                        }
                    }
                }
                pts.push({nombre: players[pi], puntos: puntos, index: pi});
            }
            pts.sort(function(a, b) { return b.puntos - a.puntos; });
            
            var maxPts = pts[0].puntos || 1;
            var h = '<div class="ranking-title">RANKING</div>';
            h += '<div class="ranking-subtitle">6 pts = Marcador exacto + ganador | 3 pts = Acertar ganador</div>';
            
            for (var i = 0; i < 5; i++) {
                var p = pts[i];
                var posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                var porcentaje = Math.round((p.puntos / maxPts) * 100);
                h += '<div class="rank-item" onclick="toggleRankDetails(this)">';
                h += '<div class="rank-pos ' + posClass + '">' + (i + 1) + '</div>';
                h += '<div style="flex:1;">';
                h += '<div class="rank-name" style="color:' + playerColors[p.index] + '">' + p.nombre + '</div>';
                h += '<div class="rank-bar"><div class="rank-fill" style="width:' + porcentaje + '%;background:' + playerColors[p.index] + '"></div></div>';
                h += '</div>';
                h += '<div class="rank-pts" id="pts-' + p.index + '">' + p.puntos + ' pts</div>';
                h += '<div class="rank-details">🔥 ' + p.nombre + ' suma ' + p.puntos + ' pts totales en toda la quiniela.</div>';
                h += '</div>';
            }
            ct.innerHTML = h;
            
            var pointsElements = ct.querySelectorAll('.rank-pts');
            pointsElements.forEach(function(el) {
                el.classList.add('pulse');
                setTimeout(function() { el.classList.remove('pulse'); }, 300);
            });
        }
        
        function toggleRankDetails(item) {
            item.classList.toggle('expanded');
        }
        
        function guardar() {
            db.ref('eo22').set(eo);
            db.ref('pe22').set(pe);
            toast('✅ Cambios guardados en Firebase');
        }
        function cargar() {
            sync();
            toast('✅ Datos sincronizados desde la nube');
        }
        function toast(m) {
            var t = document.getElementById('toast');
            t.textContent = m;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
        }
        
        document.getElementById('playerTabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('player-btn')) {
                cp = parseInt(e.target.dataset.p);
                var btns = document.querySelectorAll('#playerTabs .player-btn');
                btns.forEach(function(b) { b.classList.remove('active'); });
                e.target.classList.add('active');
                document.getElementById('predPlayerName').textContent = players[cp];
                if (cs === 'predicciones') renderPredicciones();
                if (cs === 'ranking') renderRanking();
            }
        });
        
        document.querySelector('.nav-tabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('nav-tab')) {
                cs = e.target.dataset.s;
                var tabs = document.querySelectorAll('.nav-tab');
                tabs.forEach(function(t) { t.classList.remove('active'); });
                e.target.classList.add('active');
                var sections = document.querySelectorAll('.section');
                sections.forEach(function(s) { s.classList.remove('active'); });
                document.getElementById('sec-' + cs).classList.add('active');
                if (cs === 'predicciones') renderPredicciones();
                if (cs === 'ranking') renderRanking();
            }
        });
        
        sync();
        setTimeout(function() { render(); }, 2000);
    </script>
</body>
</html>
