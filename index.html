    <style>
        :root {
            --bg: #060912;
            --card: rgba(18, 22, 45, 0.85);
            --card-hover: rgba(25, 30, 55, 0.9);

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 168, 76, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(232, 31, 118, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 70%, rgba(77, 126, 198, 0.04) 0%, transparent 50%);
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 100%; margin: 0 auto; padding: 12px; position: relative; z-index: 1; }
        
        /* HEADER */
        .header { text-align: center; padding: 15px 0 5px; }
        .header img { width: 160px; max-width: 60%; filter: drop-shadow(0 0 20px rgba(201, 168, 76, 0.6)); animation: glow 3s infinite; border-radius: 12px; }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            text-align: center;
            margin: 8px 0;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9a825, #fff9c4, #f57f17);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        
        /* PLAYER TABS */
        .players-bar {
            display: flex;

            background: rgba(255, 255, 255, 0.03);

            white-space: nowrap;

        }
        .player-btn:active { transform: scale(0.96); }

        .player-btn.p1.active { background: rgba(77, 126, 198, 0.2); color: #fff; border-color: var(--blue); box-shadow: 0 0 20px rgba(77, 126, 198, 0.3); }
        .player-btn.p2.active { background: rgba(232, 31, 118, 0.2); color: #fff; border-color: var(--pink); box-shadow: 0 0 20px rgba(232, 31, 118, 0.3); }
        .player-btn.p3.active { background: rgba(255, 109, 0, 0.2); color: #fff; border-color: var(--orange); box-shadow: 0 0 20px rgba(255, 109, 0, 0.3); }
        .player-btn.p4.active { background: rgba(124, 58, 237, 0.2); color: #fff; border-color: var(--purple); box-shadow: 0 0 20px rgba(124, 58, 237, 0.3); }
        
        /* SECTION TABS */
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            background: rgba(18, 22, 45, 0.8);
            border-radius: 14px;
            padding: 5px;
            border: 1px solid var(--border);
        }
        .nav-tab {
            flex: 1;
            padding: 10px 8px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 10px;
            transition: all 0.25s;
            text-align: center;
        }
        .nav-tab.active {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.4);
        }
        
        /* CONTENT */
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* RANKING */
        .ranking-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);

        .ranking-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            color: var(--gold);

            font-weight: 800;

        .ranking-subtitle { text-align: center; color: var(--text-secondary); font-size: 0.7rem; margin-bottom: 16px; }

            padding: 12px 14px;

            background: rgba(255, 255, 255, 0.015);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);

        .rank-pos {
            font-family: 'Space Grotesk', sans-serif;

            text-align: center;

        .rank-fill {

        /* BRACKET */
        .bracket-section { display: flex; flex-direction: column; gap: 12px; }
        .ronda-card {
            background: var(--card);

            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);

        .ronda-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            text-align: center;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            gap: 8px;
            font-size: 0.8rem;
            flex-wrap: nowrap;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .match-row:hover { border-color: var(--border-active); background: var(--card-hover); }
        .team-name {
            flex: 1;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 55px;
        }
        .team-name.right { text-align: right; justify-content: flex-end; }
        .team-flag { width: 18px; height: 13px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
        .vs-badge {
            font-weight: 700;
            color: var(--gold);
            font-size: 0.7rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }
        .score-input {
            width: 44px;
            height: 44px;
            padding: 4px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-appearance: none;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .score-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 12px rgba(201, 168, 76, 0.2); }
        .score-input.oficial { border-color: rgba(201, 168, 76, 0.5); background: rgba(201, 168, 76, 0.08); color: var(--gold); }
        .score-input.prediccion { border-color: rgba(0, 180, 179, 0.5); }
        .score-input.blocked { background: #1a1a1a !important; color: #444 !important; border-color: #333 !important; pointer-events: none; }
        
        .sub-nav { display: flex; gap: 4px; margin-bottom: 10px; justify-content: center; }
        .sub-btn {
            padding: 7px 14px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            border-radius: 20px;
            transition: all 0.25s;
        }
        .sub-btn.active { background: rgba(0, 180, 179, 0.2); color: #00B4B3; border-color: rgba(0, 180, 179, 0.4); }
        
        .empty-state { text-align: center; padding: 30px; color: var(--text-secondary); }
        
        .toast {
            position: fixed; top: 16px; right: 16px;
            background: var(--card); border: 1px solid var(--gold);
            padding: 12px 18px; border-radius: 12px; color: #fff;
            z-index: 9999; transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.75rem; backdrop-filter: blur(15px);
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        var fb = {apiKey:"AIzaSyDhCFNTSf9ti3Hbz7Z8FhpCE-J3oetYX7o",authDomain:"quiniela-2026-de452.firebaseapp.com",databaseURL:"https://quiniela-2026-de452-default-rtdb.firebaseio.com",projectId:"quiniela-2026-de452",storageBucket:"quiniela-2026-de452.firebasestorage.app",messagingSenderId:"285249629571",appId:"1:285249629571:web:1bed6ea303243d5621dab6"};
        firebase.initializeApp(fb);
        var db = firebase.database();
        
        // Jugadores (sin Lonchis)
        var players = ['Chonco', 'Oscarito', 'Allens', 'Tony', 'Alets'];
        var playerColors = ['#E4002B', '#4d7ec6', '#E81F76', '#FF6D00', '#7C3AED'];
        var cp = 0, cs = 'bracket'; // current player, current section
        
        // Ranking base (pts acumulados de grupos)
        var rankingBase = {0: 141, 1: 117, 2: 159, 3: 117, 4: 147}; // Chonco, Oscarito, Allens, Tony, Alets
        
        // Códigos de país para banderas
        var cc = {'Canada':'ca','Sudafrica':'za','Alemania':'de','Paraguay':'py','Paises Bajos':'nl','Marruecos':'ma','Francia':'fr','Suecia':'se','Portugal':'pt','Croacia':'hr','Espana':'es','Austria':'at','Estados Unidos':'us','Bosnia y Herzegovina':'ba','Belgica':'be','Senegal':'sn','Brasil':'br','Japon':'jp','Costa de Marfil':'ci','Noruega':'no','Mexico':'mx','Ecuador':'ec','Inglaterra':'gb-eng','Republica Democratica del Congo':'cd','Argentina':'ar','Cabo Verde':'cv','Australia':'au','Egipto':'eg','Suiza':'ch','Argelia':'dz','Colombia':'co','Ghana':'gh'};
        function gf(p) { return 'https://flagcdn.com/w320/' + (cc[p] || 'xx') + '.png'; }
        
        // Bracket de dieciseisavos
        var bracketEquipos = [
            ['Canadá','Sudáfrica'],['Alemania','Paraguay'],['Países Bajos','Marruecos'],['Francia','Suecia'],
            ['Portugal','Croacia'],['España','Austria'],['Estados Unidos','Bosnia y Herzegovina'],['Bélgica','Senegal'],
            ['Brasil','Japón'],['Costa de Marfil','Noruega'],['México','Ecuador'],['Inglaterra','República Democrática del Congo'],
            ['Argentina','Cabo Verde'],['Australia','Egipto'],['Suiza','Argelia'],['Colombia','Ghana']
        ];
        
        var eo = {}, pe = {}; // Datos oficiales y predicciones
        
        function init() {
            eo = {d:[], o:[], c:[], s:[], f:['',''], t:['','']};
            pe = {};
            for (var i = 0; i < 16; i++) eo.d.push(['','']);
            for (var i = 0; i < 8; i++) eo.o.push(['','']);
            for (var i = 0; i < 4; i++) eo.c.push(['','']);
            for (var i = 0; i < 2; i++) eo.s.push(['','']);
            for (var p = 0; p < 5; p++) {
                pe[p] = {d:[], o:[], c:[], s:[], f:['',''], t:['','']};
                for (var i = 0; i < 16; i++) pe[p].d.push(['','']);
                for (var i = 0; i < 8; i++) pe[p].o.push(['','']);
                for (var i = 0; i < 4; i++) pe[p].c.push(['','']);
                for (var i = 0; i < 2; i++) pe[p].s.push(['','']);
            }
        }
        init();
        
        function sync() {
            db.ref('eo16').on('value', function(s) {
                var d = s.val();
                if (d) {
                    ['d','o','c','s'].forEach(function(r) {
                        if (d[r]) d[r].forEach(function(pt, i) {
                            if (!eo[r]) eo[r] = [];
                            if (!eo[r][i]) eo[r][i] = ['',''];
                            eo[r][i][0] = pt[0] || '';
                            eo[r][i][1] = pt[1] || '';
                        });
                    });
                    if (d.f) eo.f = [d.f[0]||'', d.f[1]||''];
                    if (d.t) eo.t = [d.t[0]||'', d.t[1]||''];
                }
                render();
            });
            db.ref('pe16').on('value', function(s) {
                var d = s.val();
                if (d) {
                    for (var p = 0; p < 5; p++) {
                        if (!pe[p]) pe[p] = {d:[], o:[], c:[], s:[], f:['',''], t:['','']};
                        if (d[p]) {
                            ['d','o','c','s'].forEach(function(r) {
                                if (d[p][r]) d[p][r].forEach(function(pt, i) {
                                    if (!pe[p][r]) pe[p][r] = [];
                                    if (!pe[p][r][i]) pe[p][r][i] = ['',''];
                                    pe[p][r][i][0] = pt[0] || '';
                                    pe[p][r][i][1] = pt[1] || '';
                                });
                            });
                            if (d[p].f) pe[p].f = [d[p].f[0]||'', d[p].f[1]||''];
                            if (d[p].t) pe[p].t = [d[p].t[0]||'', d[p].t[1]||''];
                        }
                    }
                }
                render();
            });
        }
        
        function se(r, i) { db.ref('eo16/' + r + '/' + i).set({0: eo[r][i][0], 1: eo[r][i][1]}); }
        function spe(p, r, i) { db.ref('pe16/' + p + '/' + r + '/' + i).set({0: pe[p][r][i][0], 1: pe[p][r][i][1]}); }
        
        function obtenerGanador(m) {
            var gl = parseInt(m[0]), gv = parseInt(m[1]);
            if (isNaN(gl) || isNaN(gv)) return null;
            if (gl > gv) return 'local';
            if (gv > gl) return 'visitante';
            return 'empate';
        }
        
        function render() {
            renderBracket();
            renderPredicciones();
            renderRanking();
        }
        
        function renderBracket() {
            var ct = document.getElementById('bracketOficial');
            if (!ct) return;
            var h = '';
            
            function fase(titulo, ronda, num, equipos) {
                h += '<div class="ronda-card"><div class="ronda-header">' + titulo + '</div>';
                for (var i = 0; i < num; i++) {
                    var m = eo[ronda] && eo[ronda][i] ? eo[ronda][i] : ['',''];
                    var l = equipos ? equipos[i][0] : 'Local';
                    var v = equipos ? equipos[i][1] : 'Visitante';
                    h += '<div class="match-row">';
                    h += '<span class="team-name right"><img class="team-flag" src="' + gf(l) + '" alt="" onerror="this.style.display=\'none\'">' + l + '</span>';
                    h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[0] + '" data-r="' + ronda + '" data-i="' + i + '" data-t="0" placeholder="-">';
                    h += '<span class="vs-badge">vs</span>';
                    h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[1] + '" data-r="' + ronda + '" data-i="' + i + '" data-t="1" placeholder="-">';
                    h += '<span class="team-name"><img class="team-flag" src="' + gf(v) + '" alt="" onerror="this.style.display=\'none\'">' + v + '</span>';
                    h += '</div>';
                }
                h += '</div>';
            }
            
            fase('Dieciseisavos', 'd', 16, bracketEquipos);
            
            // Octavos
            h += '<div class="ronda-card"><div class="ronda-header">Octavos</div>';
            for (var i = 0; i < 8; i++) {
                var m = eo.o && eo.o[i] ? eo.o[i] : ['',''];
                var p1 = eo.d[i*2], p2 = eo.d[i*2+1];
                var eq1 = 'Ganador ' + (i*2+1), eq2 = 'Ganador ' + (i*2+2);
                if (p1 && p1[0] !== '' && p1[1] !== '') {
                    var g = obtenerGanador(p1);
                    if (g === 'local') eq1 = bracketEquipos[i*2][0];
                    else if (g === 'visitante') eq1 = bracketEquipos[i*2][1];
                }
                if (p2 && p2[0] !== '' && p2[1] !== '') {
                    var g = obtenerGanador(p2);
                    if (g === 'local') eq2 = bracketEquipos[i*2+1][0];
                    else if (g === 'visitante') eq2 = bracketEquipos[i*2+1][1];
                }
                h += '<div class="match-row">';
                h += '<span class="team-name right">' + eq1 + '</span>';
                h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[0] + '" data-r="o" data-i="' + i + '" data-t="0" placeholder="-">';
                h += '<span class="vs-badge">vs</span>';
                h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[1] + '" data-r="o" data-i="' + i + '" data-t="1" placeholder="-">';
                h += '<span class="team-name">' + eq2 + '</span>';
                h += '</div>';
            }
            h += '</div>';
            
            ['c','s'].forEach(function(r, idx) {
                var titulo = idx === 0 ? 'Cuartos' : 'Semifinales';
                var num = idx === 0 ? 4 : 2;
                h += '<div class="ronda-card"><div class="ronda-header">' + titulo + '</div>';
                for (var i = 0; i < num; i++) {
                    var m = eo[r] && eo[r][i] ? eo[r][i] : ['',''];
                    h += '<div class="match-row">';
                    h += '<span class="team-name right">Local</span>';
                    h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[0] + '" data-r="' + r + '" data-i="' + i + '" data-t="0" placeholder="-">';
                    h += '<span class="vs-badge">vs</span>';
                    h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + m[1] + '" data-r="' + r + '" data-i="' + i + '" data-t="1" placeholder="-">';
                    h += '<span class="team-name">Visitante</span>';
                    h += '</div>';
                }
                h += '</div>';
            });
            
            h += '<div class="ronda-card"><div class="ronda-header">Final</div>';
            h += '<div class="match-row">';
            h += '<span class="team-name right">Finalista 1</span>';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + (eo.f ? eo.f[0] : '') + '" data-r="f" data-i="0" data-t="0" placeholder="-">';
            h += '<span class="vs-badge">vs</span>';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + (eo.f ? eo.f[1] : '') + '" data-r="f" data-i="0" data-t="1" placeholder="-">';
            h += '<span class="team-name">Finalista 2</span>';
            h += '</div></div>';
            
            h += '<div class="ronda-card"><div class="ronda-header">3er Lugar</div>';
            h += '<div class="match-row">';
            h += '<span class="team-name right">Perdedor S1</span>';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + (eo.t ? eo.t[0] : '') + '" data-r="t" data-i="0" data-t="0" placeholder="-">';
            h += '<span class="vs-badge">vs</span>';
            h += '<input type="number" class="score-input oficial" min="0" max="99" value="' + (eo.t ? eo.t[1] : '') + '" data-r="t" data-i="0" data-t="1" placeholder="-">';
            h += '<span class="team-name">Perdedor S2</span>';
            h += '</div></div>';
            
            ct.innerHTML = h;
            ct.querySelectorAll('.score-input').forEach(function(inp) {
                inp.addEventListener('input', function() {
                    var r = this.dataset.r, i = parseInt(this.dataset.i), t = parseInt(this.dataset.t);
                    if (!eo[r]) eo[r] = [];
                    if (!eo[r][i]) eo[r][i] = ['',''];
                    eo[r][i][t] = this.value;
                    se(r, i);
                });
            });
        }
        
        function renderPredicciones() {
            var ct = document.getElementById('bracketPred');
            if (!ct) return;
            var h = '';
            var data = pe[cp] || {};
            
            h += '<div class="ronda-card"><div class="ronda-header">Dieciseisavos</div>';
            for (var i = 0; i < 16; i++) {
                var m = data.d && data.d[i] ? data.d[i] : ['',''];
                var l = bracketEquipos[i][0], v = bracketEquipos[i][1];
                var bloq = (eo.d && eo.d[i] && eo.d[i][0] !== '' && eo.d[i][1] !== '');
                var bc = bloq ? ' blocked' : '', da = bloq ? ' disabled' : '';
                h += '<div class="match-row">';
                h += '<span class="team-name right"><img class="team-flag" src="' + gf(l) + '" alt="" onerror="this.style.display=\'none\'">' + l + '</span>';
                h += '<input type="number" class="score-input prediccion' + bc + '" min="0" max="99" value="' + m[0] + '" data-r="d" data-i="' + i + '" data-t="0" placeholder="-" ' + da + '>';
                h += '<span class="vs-badge">vs</span>';
                h += '<input type="number" class="score-input prediccion' + bc + '" min="0" max="99" value="' + m[1] + '" data-r="d" data-i="' + i + '" data-t="1" placeholder="-" ' + da + '>';
                h += '<span class="team-name"><img class="team-flag" src="' + gf(v) + '" alt="" onerror="this.style.display=\'none\'">' + v + '</span>';
                h += '</div>';
            }
            h += '</div>';
            
            ct.innerHTML = h;
            ct.querySelectorAll('.score-input').forEach(function(inp) {
                inp.addEventListener('input', function() {
                    if (this.classList.contains('blocked')) return;
                    var r = this.dataset.r, i = parseInt(this.dataset.i), t = parseInt(this.dataset.t);
                    if (!pe[cp]) pe[cp] = {d:[], o:[], c:[], s:[], f:['',''], t:['','']};
                    if (!pe[cp][r]) pe[cp][r] = [];
                    if (!pe[cp][r][i]) pe[cp][r][i] = ['',''];
                    pe[cp][r][i][t] = this.value;
                    spe(cp, r, i);
                    renderRanking();
                });
            });
        }
        
        function renderRanking() {
            var ct = document.getElementById('rankingContent');
            if (!ct) return;
            
            var pts = [];
            for (var pi = 0; pi < 5; pi++) {
                var puntos = rankingBase[pi] || 0;
                // Sumar puntos de eliminatorias
                ['d','o','c','s'].forEach(function(r) {
                    var num = r === 'd' ? 16 : r === 'o' ? 8 : r === 'c' ? 4 : 2;
                    for (var i = 0; i < num; i++) {
                        var of = (eo[r] && eo[r][i]) ? eo[r][i] : ['',''];
                        var pr = (pe[pi] && pe[pi][r] && pe[pi][r][i]) ? pe[pi][r][i] : ['',''];
                        var gol = parseInt(of[0]), gov = parseInt(of[1]);
                        var gpl = parseInt(pr[0]), gpv = parseInt(pr[1]);
                        if (!isNaN(gol) && !isNaN(gov) && !isNaN(gpl) && !isNaN(gpv)) {
                            if (gpl === gol && gpv === gov) puntos += 6;
                            else if ((gol > gov && gpl > gpv) || (gol < gov && gpl < gpv) || (gol === gov && gpl === gpv)) puntos += 3;
                        }
                    }
                });
                if (eo.f && pe[pi] && pe[pi].f) {
                    var of = eo.f, pr = pe[pi].f;
                    var gol = parseInt(of[0]), gov = parseInt(of[1]), gpl = parseInt(pr[0]), gpv = parseInt(pr[1]);
                    if (!isNaN(gol) && !isNaN(gov) && !isNaN(gpl) && !isNaN(gpv)) {
                        if (gpl === gol && gpv === gov) puntos += 6;
                        else if ((gol > gov && gpl > gpv) || (gol < gov && gpl < gpv) || (gol === gov && gpl === gpv)) puntos += 3;
                    }
                }
                if (eo.t && pe[pi] && pe[pi].t) {
                    var of = eo.t, pr = pe[pi].t;
                    var gol = parseInt(of[0]), gov = parseInt(of[1]), gpl = parseInt(pr[0]), gpv = parseInt(pr[1]);
                    if (!isNaN(gol) && !isNaN(gov) && !isNaN(gpl) && !isNaN(gpv)) {
                        if (gpl === gol && gpv === gov) puntos += 6;
                        else if ((gol > gov && gpl > gpv) || (gol < gov && gpl < gpv) || (gol === gov && gpl === gpv)) puntos += 3;
                    }
                }
                pts.push({nombre: players[pi], puntos: puntos, index: pi});
            }
            pts.sort(function(a, b) { return b.puntos - a.puntos; });
            
            var maxPts = pts[0].puntos || 1;
            var h = '<div class="ranking-title">RANKING</div>';
            h += '<div class="ranking-subtitle">6 pts = Marcador exacto | 3 pts = Acertar resultado</div>';
            
            for (var i = 0; i < 5; i++) {
                var p = pts[i];
                var posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                var porcentaje = Math.round((p.puntos / maxPts) * 100);
                h += '<div class="rank-item">';
                h += '<div class="rank-pos ' + posClass + '">' + (i + 1) + '</div>';
                h += '<div style="flex:1;">';
                h += '<div class="rank-name" style="color:' + playerColors[p.index] + '">' + p.nombre + '</div>';
                h += '<div class="rank-bar"><div class="rank-fill" style="width:' + porcentaje + '%;background:' + playerColors[p.index] + '"></div></div>';
                h += '</div>';
                h += '<div class="rank-pts">' + p.puntos + ' pts</div>';
                h += '</div>';
            }
            ct.innerHTML = h;
        }
        
        // Eventos
        document.getElementById('playerTabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('player-btn')) {
                cp = parseInt(e.target.dataset.p);
                var btns = document.querySelectorAll('#playerTabs .player-btn');
                btns.forEach(function(b) { b.classList.remove('active'); });
                e.target.classList.add('active');
                document.getElementById('predPlayerName').textContent = players[cp];
                if (cs === 'predicciones') renderPredicciones();
                if (cs === 'ranking') renderRanking();
            }
        });
        
        document.querySelector('.nav-tabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('nav-tab')) {
                cs = e.target.dataset.s;
                var tabs = document.querySelectorAll('.nav-tab');
                tabs.forEach(function(t) { t.classList.remove('active'); });
                e.target.classList.add('active');
                var sections = document.querySelectorAll('.section');
                sections.forEach(function(s) { s.classList.remove('active'); });
                document.getElementById('sec-' + cs).classList.add('active');
                if (cs === 'predicciones') renderPredicciones();
                if (cs === 'ranking') renderRanking();
            }
        });
        
        sync();
        setTimeout(function() { render(); }, 1500);
    </script>
</body>
</html>
