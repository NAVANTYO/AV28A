        function renderL(){var ct=document.getElementById('leaderBox');if(!ct)return;var pts=[];for(var pi=0;pi<6;pi++){var puntos=0;for(var g=0;g<12;g++){for(var m=0;m<6;m++){var of=(od[g]&&od[g][m])?od[g][m]:['',''];var pr=(pd[pi]&&pd[pi][g]&&pd[pi][g][m])?pd[pi][g][m]:['',''];var gol=parseInt(of[0]),gov=parseInt(of[1]),gpl=parseInt(pr[0]),gpv=parseInt(pr[1]);if(!isNaN(gol)&&!isNaN(gov)&&!isNaN(gpl)&&!isNaN(gpv)){if(gpl===gol&&gpv===gov)puntos+=6;else if((gol>gov&&gpl>gpv)||(gol<gov&&gpl<gpv)||(gol===gov&&gpl===gpv))puntos+=3;}}}pts.push({nombre:players[pi],puntos:puntos,index:pi});}pts.sort(function(a,b){return b.puntos-a.puntos;});var col=['#E4002B','#4d7ec6','#009639','#E81F76','#FF6D00','#7C3AED'];var maxPts=pts[0].puntos||1;var h='<div class="clasificacion-container"><div class="clasif-card"><div class="clasif-title">RANKING</div><div class="clasif-subtitle">6 pts = Marcador exacto | 3 pts = Acertar resultado</div>';
